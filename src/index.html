<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>battleship</title>
  </head>
  <body>
    <header>
      <h1>battleship</h1>
      <!-- <div id="scrollable-content" tabindex="0">
        <p>
          Press the "Place Ships" button to randomly place your ships. Keep
          pressing until you are happy with your ship placements.
        </p>
      </div> -->
    </header>
    <main>
      <div class="main-ctn">
        <div id="pop-up" class="remove">
          <div id="pop-up-content">
            <p></p>
            <div id="winner-info">
              <p></p>
              <p></p>
            </div>
            <div id="loser-info">
              <p></p>
              <p></p>
            </div>
            <button>Play Again</button>
          </div>
        </div>
        <div id="pregame-instructions">
          <div>
            <h3>assemble your fleet!</h2>
            <p id="instructions">randomize your ship placement or place them yourself</p>
            <div class="radio-ctn">
              
              <label for="random">
                <input type="radio" id="random" value="random" name="ship-placement" checked>
                <span class="radio-text">random</span>
              </label>
              
              <label for="manual">
                <input type="radio" id="manual" value="manual" name="ship-placement">
                <span class="radio-text">manual</span>
              </label>
            </div>
          </div>
          <div id="manual-btns" class="remove">
            <button id="axis-btn">change ship axis</button>
            <button id="reset-btn">reset current ship placement</button>
            <button id="next-ship-btn">place next ship</button>
          </div>
          <div id="random-btns">
            <button id="randomize-btn">randomize</button>
          </div>
        </div>
        <section id="player-board">
          <div>
            <div class="you-ctn">
              <h2 id="you">your fleet</h2>
            </div>
            <div class="p1 battleship-ctn"></div>
          </div>
          <ul class="p1 ship-tracker">
            <li>
              carrier
              <div class="sq-ctn carrier">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              battleship
              <div class="sq-ctn battleship">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              destroyer
              <div class="sq-ctn destroyer">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              submarine
              <div class="sq-ctn submarine">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              patrol boat
              <div class="sq-ctn patrol-boat">
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
          </ul>
        </section>
        <section id="computer-board" class="remove">
          <div>
            <h2 id="computer">cpu's fleet</h2>
            <div class="p2 battleship-ctn"></div>
          </div>
          <ul class="p2 ship-tracker">
            <li>
              carrier
              <div class="sq-ctn carrier">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              battleship
              <div class="sq-ctn battleship">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              destroyer
              <div class="sq-ctn destroyer">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              submarine
              <div class="sq-ctn submarine">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              patrol boat
              <div class="sq-ctn patrol-boat">
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
          </ul>
        </section>
      </div>
      <button id="start-game">Start Game</button>
    </main>
    <footer>&copy; Emma Grey</footer>
  </body>
</html>
