<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>battleship</title>
  </head>
  <body>
    <header>
      <h1>battleship</h1>
    </header>
    <main>
      <div id="pregame-instructions">
        <div class="main-controls-ctn">
          <div class="text-ctn">
            <h3>assemble your fleet!</h2>
            <p id="instructions">randomize your ship placement or place them yourself</p>
          </div>
          <fieldset role="radiogroup" class="radio-ctn">
            <label for="random">
              <input type="radio" id="random" value="random" name="ship-placement" checked>
              <span class="radio-text">random</span>
            </label>
            
            <label for="manual">
              <input type="radio" id="manual" value="manual" name="ship-placement">
              <span class="radio-text">manual</span>
            </label>
          </fieldset>
        </div>
      </div>
      <button id="start-game">Start Game</button>
      <div class="main-ctn">
        <div id="pop-up" class="remove">
          <div id="pop-up-content">
            <p></p>
            <div id="winner-info">
              <p></p>
              <p></p>
            </div>
            <div id="loser-info">
              <p></p>
              <p></p>
            </div>
            <button>Play Again</button>
          </div>
        </div>
        <section id="player-board">
          <div>
            <div class="you-ctn">
              <h2 id="you">your fleet</h2>
            </div>
            <div class="p1 battleship-ctn"></div>
          </div>
          <ul class="p1 ship-tracker">
            <li>
              <span data-name="carrier">carrier</span>
              <div class="sq-ctn carrier">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              <span data-name="battleship">battleship</span>
              <div class="sq-ctn battleship">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              <span data-name="destroyer">destroyer</span>
              <div class="sq-ctn destroyer">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              <span data-name="submarine">submarine</span>
              <div class="sq-ctn submarine">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              <span data-name="patrol boat">patrol boat</span>
              <div class="sq-ctn patrol-boat">
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
          </ul>
          <div id="manual-btns" class="remove">
            <div>
              <fieldset role="radiogroup" class="sm-radio-ctn">
              <label for="x-axis">
                <input type="radio" id="x-axis" value="x" name="ship-axis" checked>
                <span class="radio-text">x-axis</span>
              </label>
              <label for="y-axis">
                <input type="radio" id="y-axis" value="y" name="ship-axis">
                <span class="radio-text">y-axis</span>
              </label>
            </fieldset>
              <!-- <button id="axis-btn">change ship axis</button> -->
            </div>
            <button id="reset-btn">
              <svg viewBox="0 0 24 20" title="undo" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier"> 
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M7.53033 3.46967C7.82322 3.76256 7.82322 4.23744 7.53033 4.53033L5.81066 6.25H15C18.1756 6.25 20.75 8.82436 20.75 12C20.75 15.1756 18.1756 17.75 15 17.75H8.00001C7.58579 17.75 7.25001 17.4142 7.25001 17C7.25001 16.5858 7.58579 16.25 8.00001 16.25H15C17.3472 16.25 19.25 14.3472 19.25 12C19.25 9.65279 17.3472 7.75 15 7.75H5.81066L7.53033 9.46967C7.82322 9.76256 7.82322 10.2374 7.53033 10.5303C7.23744 10.8232 6.76256 10.8232 6.46967 10.5303L3.46967 7.53033C3.17678 7.23744 3.17678 6.76256 3.46967 6.46967L6.46967 3.46967C6.76256 3.17678 7.23744 3.17678 7.53033 3.46967Z" fill="#1C274C"></path> 
                </g>
              </svg>
            </button>
            <button id="next-ship-btn">
              <svg viewBox="0 0 24 24" title="lock in ship" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                  <path fill-rule="evenodd" clip-rule="evenodd" d="M20.6097 5.20743C21.0475 5.54416 21.1294 6.17201 20.7926 6.60976L10.7926 19.6098C10.6172 19.8378 10.352 19.9793 10.0648 19.9979C9.77765 20.0166 9.49637 19.9106 9.29289 19.7072L4.29289 14.7072C3.90237 14.3166 3.90237 13.6835 4.29289 13.2929C4.68342 12.9024 5.31658 12.9024 5.70711 13.2929L9.90178 17.4876L19.2074 5.39034C19.5441 4.95258 20.172 4.87069 20.6097 5.20743Z" fill="#000000"></path>
                </g>
              </svg>
            </button>
          </div>
          <div id="random-btns">
            <button id="randomize-btn">randomize</button>
          </div>
        </section>
        <section id="computer-board" class="remove">
          <div>
            <h2 id="computer">cpu's fleet</h2>
            <div class="p2 battleship-ctn"></div>
          </div>
          <ul class="p2 ship-tracker">
            <li>
              carrier
              <div class="sq-ctn carrier">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              battleship
              <div class="sq-ctn battleship">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              destroyer
              <div class="sq-ctn destroyer">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              submarine
              <div class="sq-ctn submarine">
                <span class="sq"></span>
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
            <li>
              patrol boat
              <div class="sq-ctn patrol-boat">
                <span class="sq"></span>
                <span class="sq"></span>
              </div>
            </li>
          </ul>
        </section>
      </div>
    </main>
    <footer>&copy; Emma Grey</footer>
  </body>
</html>
